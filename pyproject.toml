[project]
name = "papers-agents"
version = "0.1.0"
description = "Evidence-grounded paper reading, analysis, and optional cross-paper review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.111.0",
    "chromadb>=1.5.9",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.6",
    "openai>=2.43.0",
    "pillow>=13.0.0",
    "pydantic>=2.13.4",
    "pypdf>=5.0.0",
    "pypdfium2>=5.15.2",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
image-retrieval = ["numpy>=1.26", "onnxruntime>=1.17", "tokenizers>=0.20"]
gme = ["torch>=2.6,<2.10", "torchvision>=0.21,<0.25", "transformers==4.51.3"]
